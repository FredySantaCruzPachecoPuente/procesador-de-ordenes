<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { font-size: 18px; color: #333; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #startBtn { background: #2ecc71; color: white; }
        #startBtn:hover { background: #27ae60; }
        #stopBtn { background: #e74c3c; color: white; }
        #stopBtn:hover { background: #c0392b; }
        #progress-container { margin-top: 15px; max-height: 150px; overflow-y: auto; font-size: 12px; border-top: 1px solid #eee; padding-top: 10px; }
        .log-entry { margin-bottom: 5px; padding: 4px; border-radius: 4px; background: #f9f9f9; }

        /*.log-entry {
            padding: 4px 0;
            font-size: 13px;
        }*/

        .log-entry.error {
            color: #dc3545;
            font-weight: 600;
        }

        .log-entry.success {
            color: #28a745;
            font-weight: 600;
        }


        .error { color: #e74c3c; font-weight: bold; }
        .progressBar{
            height:8px;
            background: #d1d2d3;
            border-radius:10px;
            margin-top:5px;
            overflow:hidden;
        }
        #progress{
            height:100%;
            width:0%;
            background:#22c55e;
        }
        .header-container {
            display: flex;         /* Activa el modo flexible */
            align-items: center;   /* Alinea verticalmente al centro */
            gap: 10px;             /* Espacio entre la imagen y el texto */
        }

        .logo-img {
            width: 25px;
            height: auto;          /* Mantiene la proporción */
        }

        .title {
            margin: 0;             /* Elimina el margen por defecto del h2 */
            font-size: 1rem;     /* Ajusta el tamaño según necesites */
        }
        .arrow{
            font-size: 2rem;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header-container">
        <img src="favicon.png" alt="Logo" class="logo-img">
        <h2 class="title">Marketcare ↔ Mediven V1</h2>
    </div>

    <input type="text" id="orderNumber" placeholder="Número de Orden (ej: 12345)">
    <div class="btn-group">
        <button id="startBtn">Iniciar</button>
        <button id="stopBtn" style="display: none">Detener</button>
    </div>
    <div id="progressTxt" class="error" style="text-align: center;margin-top: 15px"></div>
    <div class="progressBar">
        <div id="progress"></div>
    </div>
    <div id="progress-container">
        <div id="statusText"></div>
        <div id="logs"></div>
    </div>
</div>
<script src="popup.js"></script>
</body>
</html>
